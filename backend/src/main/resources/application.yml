server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: malthouse
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/malthouse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

malthouse:
  jwt:
    secret: ${JWT_SECRET:malthouse-jwt-hs256-secret-change-me-32bytes}
    expiration-ms: 86400000
